<!DOCTYPE html>
<html>
<head>
    <title>Hotbeans Web - Trainers</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        /* LOGO AREA */
        .logo-area {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ccc;
        }

        .logo-area img {
            width: 200px;
            height: auto;
        }

        /* NAVIGATION */
        .nav {
            background: #ff3c00;
            padding: 12px;
            text-align: center;
        }

        .nav a {
            margin-right: 15px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        /* HERO */
        .hero {
            padding: 50px;
            background: #ffe2d4;
            text-align: center;
            border-bottom: 1px solid #ccc;
        }

        .hero h1 {
            margin: 0;
            font-size: 34px;
            color: #ff3c00;
        }

        .hero p {
            margin-top: 10px;
            font-size: 17px;
            color: #333;
        }

        /* STAFF SECTION */
        .section {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .staff-box {
            background: #ffffff;
            display: flex;
            border: 1px solid #ddd;
            margin-bottom: 15px;
            padding: 15px;
        }

        .staff-box img {
            width: 120px;
            height: 120px;
            margin-right: 20px;
        }

        .staff-info h3 {
            margin: 0;
            color: #ff3c00;
        }

        /* FOOTER */
        .footer {
            background: #222;
            color: #FFFFFF;
            padding: 15px;
            text-align: center;
            margin-top: 30px;
            font-size: 15px;
            border-top: 4px solid #ff3c00;
        }
    </style>
</head>
<body>

    <!-- LOGO AREA -->
    <div class="logo-area">
        <img src="images/hotbeanslogo2.png" alt="Hotbeans Logo">
    </div>

    <!-- NAVIGATION -->
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="company.html">Company</a>
        <a href="trainers.html">Trainers</a>
        <a href="course.html">Course</a>
        <a href="apply.html">Apply</a>
        <a href="help.html">Help</a>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>Meet the Trainers</h1>
        <p>Learn more about the experts who guide new developers into the industry.</p>
    </div>

    <!-- STAFF SECTION -->
    <div class="section">

        <div class="staff-box">
            <img src="images/johnsmith.png" alt="Trainer Photo">
            <div class="staff-info">
                <h3>John Smith</h3>
            </div>
        </div>

        <div class="staff-box">
            <img src="images/sarahjohnson.png" alt="Trainer Photo">
            <div class="staff-info">
                <h3>Sarah Johnson</h3>
            </div>
        </div>

        <div class="staff-box">
            <img src="images/michaellee.png" alt="Trainer Photo">
            <div class="staff-info">
                <h3>Michael Lee</h3>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 Hotbeans Web — Learning Made Simple
    </div>

</body>
</html>
